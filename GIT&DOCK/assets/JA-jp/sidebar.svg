<svg xmlns="http://www.w3.org/2000/svg" width="320" height="828" viewBox="0 0 320 828" font-family="Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans', sans-serif">
  <style>
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(868px); } }
    @keyframes shimmer { from { transform: translateX(-320px); } to { transform: translateX(320px); } }
    .bar { transform-origin: 20px 0; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .row, .head { opacity: 0; animation: rise .5s ease-out forwards; }
    .label { font-size: 11.5px; fill: #c7d5e0; }
    .pct { font-size: 11px; font-weight: 600; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .sweep { animation: sweep 9s linear 2s infinite; }
    .shine { animation: shimmer 3.2s ease-in-out 1.6s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2838"/><stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/><stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66c0f4" stop-opacity="0"/><stop offset=".5" stop-color="#66c0f4" stop-opacity=".07"/><stop offset="1" stop-color="#66c0f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="320" height="828" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="320" height="828" rx="10" fill="url(#bg)"/>
    <rect width="320" height="4" fill="url(#accent)"/>
    <rect class="sweep" width="320" height="40" fill="url(#beam)"/>
  </g>
  <rect x=".5" y=".5" width="319" height="827" rx="10" fill="none" stroke="#2a475e"/>
  <g class="head">
    <circle class="dot" cx="24" cy="30" r="4" fill="#66c0f4"/>
    <text x="36" y="35" font-size="17" font-weight="700" fill="#e6f0f8" letter-spacing="1">C2UI</text>
    <text x="300" y="35" font-size="12" fill="#8fa5b8" text-anchor="end">完成度</text>
  </g>
  <g class="head" style="animation-delay:.15s">
    <text x="20" y="66" font-size="11.5" fill="#c7d5e0">全体</text>
    <text x="300" y="70" font-size="22" font-weight="700" fill="#66c0f4" text-anchor="end">49%</text>
    <rect x="20" y="76" width="280" height="10" rx="5" fill="#0e1720"/>
    <g clip-path="url(#panel)">

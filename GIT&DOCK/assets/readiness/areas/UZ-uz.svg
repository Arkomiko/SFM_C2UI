<svg xmlns="http://www.w3.org/2000/svg" width="960" height="706" viewBox="0 0 960 706" font-family="Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans', sans-serif">
  <style>
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes shimmer { from { transform: translateX(-960px); } to { transform: translateX(960px); } }
    .bar { transform-origin: 324px 0; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .row, .head { opacity: 0; animation: rise .5s ease-out forwards; }
    .label { font-size: 12px; fill: #c7d5e0; }
    .pct { font-size: 11.5px; font-weight: 600; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .shine { animation: shimmer 3.2s ease-in-out 1.6s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2838"/><stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/><stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="960" height="706" rx="10"/></clipPath>
    <clipPath id="track"><rect x="324" y="66" width="556" height="14" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="960" height="706" rx="10" fill="url(#bg)"/>
    <rect width="960" height="4" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="705" rx="10" fill="none" stroke="#2a475e"/>
  <g class="head">

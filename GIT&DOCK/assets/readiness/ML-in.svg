<svg xmlns="http://www.w3.org/2000/svg" width="960" height="96" viewBox="0 0 960 96" font-family="Segoe UI, Roboto, Helvetica, Arial, 'Noto Sans', sans-serif">
  <style>
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes shimmer { from { transform: translateX(-960px); } to { transform: translateX(960px); } }
    .bar { transform-origin: 24px 0; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .head { opacity: 0; animation: rise .5s ease-out forwards; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .shine { animation: shimmer 3.2s ease-in-out 1.8s infinite; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2838"/><stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66c0f4"/><stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="960" height="96" rx="10"/></clipPath>
    <clipPath id="track"><rect x="24" y="56" width="912" height="16" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
    <rect width="960" height="96" rx="10" fill="url(#bg)"/>
    <rect width="960" height="4" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="95" rx="10" fill="none" stroke="#2a475e"/>
  <g class="head">
    <circle class="dot" cx="28" cy="32" r="4" fill="#66c0f4"/>
    <text x="40" y="37" font-size="16" font-weight="700" fill="#e6f0f8" letter-spacing="1">C2UI</text>
    <text x="96" y="37" font-size="12.5" fill="#c7d5e0">മൊത്തം</text>
    <text x="936" y="38" font-size="24" font-weight="700" fill="#66c0f4" text-anchor="end">15%</text>
  </g>
  <rect x="24" y="56" width="912" height="16" rx="8" fill="#0e1720"/>
  <g clip-path="url(#track)">
    <rect x="24" y="56" width="136.8" height="16" rx="8" fill="url(#accent)" class="bar"/>
    <rect x="24" y="56" width="136.8" height="16" rx="8" fill="url(#shine)" class="shine"/>
  </g>
  <g class="head" style="animation-delay:.4s">
    <text x="24" y="86" font-size="10.5" fill="#8fa5b8">398 ടെസ്റ്റുകൾ</text>
    <text x="936" y="86" font-size="10.5" fill="#8fa5b8" text-anchor="end">Windows · Python 3.13 · Qt 6 · OpenGL 3.3</text>
  </g>
</svg>
